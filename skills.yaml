# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: cdupuis skills
description: The agent skills in github.com/cdupuis/skills and the external ones it pins (superpowers, emilkowalski/skills, impeccable, taste), shown in the agent's skill directory.
sourceUrl: https://github.com/cdupuis/skills
version: "1.1.0"
# The external skills. The humanizer skill in this repo has no license.
licenses: [MIT, Apache-2.0]

capabilities:
  # One entry per skill: the directories of this repo, then the skills
  # of the repos in external.txt. The build fails when a skill has no
  # entry here, or an entry has no skill.
  #
  # Optional, so that a sandbox whose skill store already holds a skill
  # of the same name still starts: the runtime never overwrites an
  # existing skill and would refuse a required request.

  # This repo
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/cdupuis-skills/humanizer

  # superpowers (obra/superpowers)
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/cdupuis-skills/brainstorming
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/cdupuis-skills/diagnosing-superpowers
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/cdupuis-skills/dispatching-parallel-agents
  - type: com.docker.sandbox/agent-skill@1
    optional: true
