# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Humanizer skill
description: Agent skill that makes text read as written by a person, with a checker for the tells of AI writing.
sourceUrl: https://github.com/cdupuis/skills
version: "1.0.0"

capabilities:
  # Optional, so that a sandbox whose skill store already holds a
  # `humanizer` skill still starts: the runtime never overwrites an
  # existing skill of the same name and would refuse a required request.
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/cdupuis-skills/humanizer

  # The context is for agents with no skill discovery, and it repeats the
  # standing rule so that the skill is used without being asked for.
  # Both versions are offered while runtimes move from 1 to 2; a runtime
  # selects one.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        ## Humanizer

        Text written for the user, or sent under their name, has to read
        as if a person wrote it. Before writing prose another person will
        read (a Slack message, an email, a pull request or issue
        description, a commit message, a review comment, a document, a
        report), use the `humanizer` skill.

        If the skill is not in your skill list, read
        /usr/share/cdupuis-skills/humanizer/SKILL.md and follow it. Its
        checker runs as
        `python3 /usr/share/cdupuis-skills/humanizer/scripts/check.py FILE`.
  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
